apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash
  namespace: study
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash
  template:
    metadata:
      labels:
        app: crash
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: app
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo boom; exit 1"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
