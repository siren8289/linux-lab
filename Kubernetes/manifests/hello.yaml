apiVersion: v1
kind: Pod
metadata:
  name: hello
  namespace: study
  labels:
    app: hello
spec:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
      ports:
        - containerPort: 80
