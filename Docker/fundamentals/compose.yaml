# Host port 8081: 127.0.0.1:8080 is already published by the kind node
# gitops-lab-control-plane. The container still listens on 8080.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
