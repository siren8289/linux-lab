services:
  api:
    build: .
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - app-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 5s
      timeout: 2s
      retries: 3

volumes:
  app-data:
